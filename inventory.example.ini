# Copy to inventory.ini and fill in your own Pis.
# zabbix_server: the Zabbix server (or proxy) that may query the agent.
# Run against ONE Pi at a time (-l <host>): -K asks for one sudo password, and they may differ per Pi.

[ups_pis]
# Fresh Pi: the playbook sets up NUT from scratch (vendor/product id from `lsusb`, optional).
pi1.example.org zabbix_server=192.0.2.10 nut_vendorid=051D nut_productid=0002 nut_desc="APC Back-UPS"

# Pi where NUT was already set up by hand: keep that setup, only add upsmon + the Zabbix part.
# ups_name must match the existing [section] in /etc/nut/ups.conf.
# pi2.example.org zabbix_server=192.0.2.10 nut_manage=false nut_upsmon=true ups_name=myups

[ups_pis:vars]
ansible_user=pi
ansible_python_interpreter=/usr/bin/python3
